<style>

  .boot-err { display: none; margin: 10px; padding: 10px 12px; border: 1px solid #e66b6b; border-radius: 10px; background: #2a1517; color: #ffd7d7; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
</style>
<script>
// v0.69.5：手機版出錯時把原因顯示在畫面上（以前會一片空白、看不出是哪裡壞）。這段用最舊的寫法，舊手機也跑得動
window.__szgErr = [];
function __szgShow(msg) {
  try {
    window.__szgErr.push(msg);
    var b = document.getElementById('bootErr'); if (!b) return;
    b.style.display = 'block';
    b.textContent = '手機版出錯了，請截這個畫面給中控的作者：\n' + window.__szgErr.slice(-5).join('\n') + '\n\n網址：' + location.origin + location.pathname + '\n瀏覽器：' + navigator.userAgent;
  } catch (e) {}
}
window.onerror = function (m, src, line, col) { __szgShow('程式錯誤：' + m + '（第 ' + line + ' 行 ' + col + '）'); };
window.addEventListener && window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; __szgShow('程式錯誤：' + (r && r.message ? r.message : r)); });
</script>

<script>
'use strict';
// ---------- 通行碼：第一次從 QR code 網址的 #t= 拿到，存在這台手機 ----------
(() => { const m = /[#&]t=([0-9a-f]+)/.exec(location.hash); if (m) { try { localStorage.setItem('szgM_t', m[1]); } catch (_) {} } })();
window.addEventListener('hashchange', () => { const m = /[#&]t=([0-9a-f]+)/.exec(location.hash); if (m && m[1] !== TOKEN) location.reload(); }); // 已經開著時又掃了新的 QR
const TOKEN = (() => { try { return localStorage.getItem('szgM_t') || ''; } catch (_) { return ''; } })() || ((/[#&]t=([0-9a-f]+)/.exec(location.hash) || [])[1] || '');
// 「加到主畫面」會用目前網址（或 manifest 的啟動網址）開新的 App，那邊讀不到這裡存的通行碼：網址和 manifest 都保留通行碼
(() => {
  if (TOKEN && !location.hash.includes('t=' + TOKEN)) history.replaceState(null, '', location.pathname + '#t=' + TOKEN);
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = '/m/manifest.webmanifest' + (TOKEN ? '?t=' + TOKEN : ''); document.head.appendChild(l);
})();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = n => { n = Number(n) || 0; const a = Math.abs(n); return a >= 1e8 ? (n / 1e8).toFixed(a >= 1e9 ? 0 : 2) + '億' : a >= 1e4 ? (n / 1e4).toFixed(a >= 1e5 ? 0 : 1) + '萬' : String(Math.round(n)); };
const hm = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600e3), m = Math.floor(ms % 3600e3 / 60e3); return h ? `${h}時${m}分` : `${m}分`; };
// 升級時間（和電腦面板同一套）：精確的經驗表（中控收集到的）＋原版經驗 × 最接近等級的倍率估計
const ORIG_EXP = (() => { const t = [0]; for (let lv = 1; lv <= 250; lv++) { let v; if (lv <= 5) v = (Math.floor(lv * lv / 2) + 15) * lv; else if (lv <= 50) { const q = Math.floor(lv * lv / 3); v = (q + 19) * q; } else v = Math.trunc(t[lv - 1] * 1.0548); t.push(v); } return t; })();
const EXP_MULT_HINT = [[50, 1.25], [65, 1.5], [83, 3], [100, 4], [250, 6]];
function expTableNow() { const t = { ...((D && D.expTable) || {}) }; for (const c of (D && D.chars) || []) if (c.nextXpExact && c.lv && c.nextXp && !t[c.lv]) t[c.lv] = c.nextXp; return t; }
function expNeed(lv, tbl) {
  if (tbl[lv]) return { v: tbl[lv], exact: true };
  const ks = Object.keys(tbl).map(Number).filter(k => ORIG_EXP[k]);
  const mult = ks.length ? (k => tbl[k] / ORIG_EXP[k])(ks.reduce((a, b) => Math.abs(b - lv) < Math.abs(a - lv) ? b : a)) : (EXP_MULT_HINT.find(([l]) => lv <= l) || [0, 6])[1];
  return { v: Math.round((ORIG_EXP[lv] || ORIG_EXP[250]) * mult), exact: false };
}
// 速度：遊戲的整輪平均（和電腦面板一致）；沒有的話用中控量的近 3 分鐘
const expRateOf = c => c.hourly || c.live || 0;
function lvTime(c, target, tbl) {
  if (!c || !c.lv || c.unsynced || !target || target <= c.lv) return null;
  let exact = true, total = 0;
  for (let l = c.lv; l < target; l++) { const need = l === c.lv && c.nextXp ? { v: c.nextXp, exact: true } : expNeed(l, tbl); if (!need.exact) exact = false; total += l === c.lv ? Math.max(0, need.v - (c.xp || 0)) : need.v; }
  const r = expRateOf(c);
  return { exp: total, exact, h: r ? total / r : null };
}
const dur = h => { if (h == null || !isFinite(h)) return '—'; const m = Math.round(h * 60); if (m < 60) return `${m}分`; if (m < 48 * 60) return `${Math.floor(m / 60)}時${m % 60}分`; const d = Math.floor(m / 1440); return `${d}天${Math.round((m % 1440) / 60)}時`; };
const eta = h => { const d = new Date(Date.now() + h * 3600e3); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
const ago = ms => ms < 60e3 ? `${Math.max(0, Math.round(ms / 1000))}秒前` : ms < 3600e3 ? `${Math.round(ms / 60e3)}分前` : `${Math.round(ms / 3600e3)}時前`;
const clock = t => { const d = new Date(t); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); }
class AuthErr extends Error {}
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json', ...(TOKEN ? { 'X-Hub-Token': TOKEN } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) throw new AuthErr('需要配對');
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error ? j.error + '，' : '') + 'HTTP ' + r.status);
  return j;
}
const avatar = (c, cls = '') => c.ava ? `<img class="${cls}" src="/api/avatar/${encodeURIComponent(c.id)}?t=${c.ava}${TOKEN ? '&token=' + TOKEN : ''}" alt="" loading="lazy">` : `<span class="ph ${cls}" style="font-size:24px;opacity:.35">👤</span>`;

// ---------- 狀態 ----------
let D = null, MAPS = null, BOSSES = null, BOSS = null, view = 'chars';
async function loadMaps() { if (MAPS) return; const r = await api('/api/m/maps'); MAPS = r.maps; BOSSES = r.bosses || []; }
const ui = { grp: localStorage.getItem('szgM_grp') || 'all', q: '', sel: null, bq: '', bOnly: false,
  tgt: (v => v >= 2 && v <= 250 ? v : 0)(Number(localStorage.getItem('szgM_tgt'))), sort: localStorage.getItem('szgM_sort') || 'tab' };
const byId = id => (D && D.chars.find(c => c.id === id)) || null;
const issues = c => { const out = []; if (c.dead) out.push(['bad', '倒下']); if (c.offline) out.push(['warn', '離線掛機']); if (!c.unsynced && c.tab && !c.auto && !c.job2) out.push(['warn', '沒在掛機']); return out; };
async function load(quiet) {
  try {
    D = await api('/api/m/summary');
    $('#st').textContent = '已更新 ' + clock(D.now);
    render();
  } catch (e) {
    if (e instanceof AuthErr) return showPair();
    load.lastErr = e.message || String(e);
    $('#st').innerHTML = '<span class="bad">連不到中控</span>';
    if (!quiet) toast('連不到中控：' + e.message);

}

  return [...m.values()].sort((a, b) => (a.lv || 0) - (b.lv || 0));
}

      <div class="dim sm">🗺 ${esc(mapName)}${p.sell ? '・套用時一起設定自動販售' : ''}</div>
      <div class="mems">${mem.map((c, i) => `<div class="mem">${avatar(c)}${i === 0 && mem.length > 1 ? '👑' : ''}${esc(c.name)}<div class="dim">Lv${c.lv}</div></div>`).join('')}</div>
      <div class="sm">全隊近 3 分 <b class="good">${lv.length ? short(sum) + '/時' : '—'}</b>${away.length ? `・<span class="warn">${esc(away.map(c => c.name).join('、'))} 不在這張圖</span>` : ''}</div>
      <div class="acts" style="margin-top:8px"><button class="btn sm primary" data-pt="${esc(p.id)}" ${mem.length && !busy ? '' : 'disabled'}>套用</button></div></div>`;
  }).join('') || '<div class="empty">還沒有隊伍：在電腦面板的「組隊」分頁排好後，這裡就能一鍵套用。</div>';
}
async function applyParties(ids) {
  const ps = (D.parties || []).filter(p => (p.members || []).length && (!ids || ids.includes(p.id)));
  if (!ps.length) return;
  if (!confirm(`套用 ${ps.map(p => p.name || '隊伍').join('、')}？\n隊伍不是這幾個人的會先離隊、重新組隊；換圖後開始掛機。`)) return;
  try { const r = await api('/api/party/apply', { parties: ps.map(p => ({ id: p.id, name: p.name, members: p.members, map: p.map, mapName: '', sell: p.sell })) }); toast(`已送出 ${r.jobs} 個組隊工作`); setTimeout(() => load(true), 2500); }
  catch (e) { toast('套用失敗：' + e.message); }
}

// ---------- 更多 ----------
function renderMore() {
  const u = D.update || {};
  $('#info').innerHTML = `<b>中控版本</b><span>${esc(D.version)}${u.hasUpdate ? ` <span class="warn">（有新版 ${esc(u.latest)}，在電腦上更新）</span>` : ''}</span><b>角色</b><span>${D.chars.length} 隻</span><b>更新頻率</b><span>每 10 秒（畫面在前景時）</span>`;
  $('#fullPanel').href = '/?token=' + TOKEN;
  $('#idleLog').innerHTML = (D.idleLog || []).slice().reverse().map(l => `<div class="row"><div class="m"><span class="dim">${clock(l.at)}</span> ${esc(l.name || '')}：${esc(l.msg)}</div></div>`).join('') || '<span class="dim">還沒有紀錄</span>';
}

// ---------- 底部面板 ----------
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on'); }
$('#sheetBg').onclick = closeSheet;

// ---------- 事件 ----------
function go(v) {
  view = v; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  if (v !== 'chars') $('#actbar').classList.remove('on');
  if (v === 'boss') loadBoss().then(render);
  window.scrollTo(0, 0); render();
}
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-ch], [data-pickmap], [data-bkm], [data-btog], [data-bstop], [data-bstopall]'); if (!t) return;
  const d = t.dataset;
  try {
    if (d.v) return go(d.v);
    if (d.goto) return go(d.goto);
    if (t.id === 'refresh') { if (view === 'boss') await loadBoss(); return load(); }
    if (d.grp) { ui.grp = d.grp; try { localStorage.setItem('szgM_grp', d.grp); } catch (_) {} return renderChars(); }
    if (t.id === 'selMode') { ui.sel = ui.sel ? null : new Set(); return renderChars(); }
    if (d.selall != null) { document.querySelectorAll('#chars [data-ch]').forEach(x => { const c = byId(x.dataset.ch); if (c && !c.unsynced) ui.sel.add(c.id); }); return renderChars(); }
    if (d.ch) { if (ui.sel) { ui.sel.has(d.ch) ? ui.sel.delete(d.ch) : ui.sel.add(d.ch); return renderChars(); } return openChar(d.ch); }
    if (d.open) return openChar(d.open);
    if (d.act) { const ids = [...ui.sel]; if (d.act === 'map') return openMaps(ids); return idle(ids, d.act); }
    if (d.one) { const [a, id] = d.one.split('|'); if (a === 'map') return openMaps([id]); return idle([id], a); }
    if (d.pickmap) { const m = MAPS.find(x => x[0] === d.pickmap); return idle(ui.mapIds, 'map', { map: m[0], mapName: m[1] }); }
    if (d.job) {
      const [a, id] = d.job.split('|'), j = D.jobs.find(x => x.id === id);
      if (a === 'approve' && !confirm(`確認執行？\n${KIND[j.kind] || j.kind}：${j.from}${j.to && j.to !== j.from ? ' → ' + j.to : ''}\n${j.what || j.msg || ''}`)) return;
      if (a === 'delete' && !confirm('刪除這個失敗的工作？')) return;
      await api(`/api/jobs/${id}/${a}`, {}); toast('已送出'); return load(true);
    }
    if (t.id === 'approveAll') { const n = D.jobs.filter(j => j.status === 'pending').length; if (!n || !confirm(`確認執行全部 ${n} 個待確認的工作？`)) return; await api('/api/jobs/approve-all', {}); return load(true); }
    if (t.id === 'retryAll') { const n = D.jobs.filter(j => j.status === 'failed').length; if (!n || !confirm(`重試全部 ${n} 個失敗的工作？（從各自失敗的那一批重新開始）`)) return; const r = await api('/api/jobs/retry-all', {}); toast(`已重試 ${r.retried} 個`); return load(true); }
    if (t.id === 'clearDone') { await api('/api/jobs/clear', {}); return load(true); }
    if (t.id === 'clearFailed') { if (!confirm('清除所有失敗的工作？')) return; await api('/api/jobs/clear', { failed: true }); return load(true); }
    if (d.bm) {
      if (!BOSS) await loadBoss();
      if (d.bm === 'auto' && !confirm('開啟自動出發：有勾王的角色會自動換到野王地圖打王，打完再換回原本的地圖。確定？')) return;
      await saveBoss({ mode: d.bm }); return toast('打王：' + t.textContent);
    }
    if (t.id === 'bossRun') { BOSS = await api('/api/boss/run-now', {}); toast('已檢查'); return render(); }
    if (d.bkm) { const [id, mob] = d.bkm.split('|'), cm = BOSS.cfg.charMobs || {}; let l = [...(cm[id] || [])]; if (mob === '*') l = bossList().map(b => b.mob); else l = l.includes(mob) ? l.filter(x => x !== mob) : [...l, mob]; return setCharMobs(id, l); }
    if (d.bk) { const [a, id] = d.bk.split('|'), c = byId(id); return setCharMobs(id, a === 'all' ? ['*'] : a === 'none' ? [] : bossList().filter(b => (b.lv || 0) <= ((c && c.lv) || 0)).map(b => b.mob)); }
    if (d.bstop || d.bstopall) { // 強制停止：放棄這隻王、回原本的地圖練功
      if (!confirm(d.bstop ? '這隻放棄打王，回原本的地圖練功？（30 分鐘內不再派去打王）' : '打這隻王的全部放棄，回原本的地圖練功？（30 分鐘內不再派去打王）')) return;
      await api('/api/boss/stop', d.bstop ? { charIds: [d.bstop] } : { instanceId: d.bstopall }); toast('已送出停止'); await load(); await loadBoss(); return render();
    }
    if (d.btog) { const set = new Set(BOSS.cfg.togetherMobs || []); set.has(d.btog) ? set.delete(d.btog) : set.add(d.btog); return saveBoss({ togetherMobs: [...set] }); }
    if (d.pt) return applyParties([d.pt]);
    if (t.id === 'ptAll') return applyParties(null);
    if (t.id === 'logout') { if (!confirm('登出這台手機？之後要重新掃 QR code 配對。（要完全撤銷請在電腦面板的「📱 手機」移除這台）')) return; try { localStorage.removeItem('szgM_t'); } catch (_) {} location.replace(location.pathname); return; }
  } catch (err) { if (err instanceof AuthErr) return showPair(); toast('失敗：' + err.message); }
});
$('#q').oninput = e => { ui.q = e.target.value; renderChars(); };
$('#tgt').oninput = e => { const v = Math.floor(Number(e.target.value)); ui.tgt = v >= 2 && v <= 250 ? v : 0; try { localStorage.setItem('szgM_tgt', String(ui.tgt || '')); } catch (_) {} renderChars(); };
$('#sortBy').onchange = e => { ui.sort = e.target.value; try { localStorage.setItem('szgM_sort', ui.sort); } catch (_) {} renderChars(); };
$('#bq').oninput = e => { ui.bq = e.target.value; renderBoss(); };
$('#bOnly').onchange = e => { ui.bOnly = e.target.checked; renderBoss(); };
$('#bPartyMode').onchange = async e => { if (!BOSS) await loadBoss(); await saveBoss({ partyMode: e.target.value }).catch(err => toast('失敗：' + err.message)); toast(e.target.value === 'split' ? '隊伍改成各自分開打' : e.target.value === 'mixed' ? '隊伍改成依王決定：點下面的王選哪些一起打' : '隊伍改成整隊一起打'); render(); };
$('#bChain').onchange = async e => { if (!BOSS) await loadBoss(); await saveBoss({ chain: e.target.checked }).catch(err => toast('失敗：' + err.message)); toast(e.target.checked ? '連續打：全部打完才回練功圖' : '每打完一隻先回練功圖'); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) { load(true); if (view === 'boss' && D && (D.boss.live || []).length) loadBoss().then(render); } }, 10000);
load();
// 8 秒還沒拿到中控的資料（也不是配對畫面）：把卡在哪裡顯示出來
setTimeout(() => { if (!D && !document.querySelector('.pair')) __szgShow('8 秒還沒收到中控的資料' + (load.lastErr ? '：' + load.lastErr : '（還在等回應，可能是網路或 Tailscale 連線很慢）')); }, 8000);
</script>
</body>
</html>
